<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <!-- Link to Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif; /* A modern font for cleaner look */
        }

        body {
            background-color: #c0d5e7; /* Updated background color for the dashboard */
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100%;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar Styling */
        .sidebar {
            position: fixed; /* Fixes the sidebar on the screen */
            top: 0;
            left: 0;
            background-color: #34495e; /* Darker, attractive blue-grey color */
            padding: 20px;
            width: 250px;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
            transition: width 0.3s ease; /* Smooth collapse transition */
        }

        .sidebar.collapsed {
            width: 0;
            padding: 20px 0px;
            overflow: hidden; /* Hide content when collapsed */
        }

        .menu-item {
            background-color: #2c3e50;
            color: #fff;
            border: none;
            padding: 15px;
            text-align: left;
            font-size: 18px;
            cursor: pointer;
            border-radius: 10px; /* Softer border-radius */
            display: flex;
            margin-top: 20px;
            align-items: center;
            transition: background-color 0.3s ease;
        }

        .menu-item i {
            margin-right: 12px; /* Add space between icon and text */
            font-size: 20px;
        }

        .menu-item:hover {
            background-color: #3b3636; /* Attractive teal hover color */
        }

        /* Removing underline from links */
        a {
            text-decoration: none;
        }

        /* Back arrow */
        .back-arrow {
            background-color: none;
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 24px;
            display: inline-block;
            cursor: pointer;
            margin-bottom: 10px;
            transition: background-color 0.3s ease;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            margin-left: 250px; /* Offset the main content to the right of the sidebar */
            padding: 20px;
            background-color: #c0d5e7; /* Clean white background */
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1); /* Light shadow */
            border-radius: 10px;
            overflow-y: auto; /* Allow scrolling within content */
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 26px;
            display: flex;
            align-items: center;
            color: #2c3e50; /* Dark text for good contrast */
        }
        

        .menu-toggle {
            font-size: 24px;
            margin-right: 15px;
            cursor: pointer;
            color: #2c3e50;
        }

        /* Logout icon styling */
        .logout {
            font-size: 24px;
            color: #2c3e50;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .logout:hover {
            color: #e74c3c; /* Hover color for logout icon */
        }

        /* Updated layout for Graph and Text */
        .analysis-section {
            display: flex;
            flex-direction: column; /* Stack the text on top of the graph */
            justify-content: left;
            align-items: left;
            margin-top: 36px;
            margin-bottom: 20px;
        }

        .analysis-section h2 {
            font-size: 20px;
            margin-bottom: 30px; /* Space between text and graph */
            color: #34495e;
            font-weight: bold; /* Make text bold for emphasis */
        }

        /* Updated Graph Styling */
        .graph {
        width: 95%; /* Make the graph wider, covering almost the entire body width */
        height: 650px; /* Increased height to accommodate x-axis labels */
        margin-top: 10px;
        background: rgba(255, 255, 255, 0.1); /* Semi-transparent background */
        border-radius: 10px; /* Optional: Keep rounded corners */
        box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.1); /* Add light shadow to enhance the glass effect */
        backdrop-filter: blur(10px); /* Apply blur effect for the glass finish */
        position: relative; /* Ensure positioning is correct */
        border: 2px solid rgba(255, 255, 255, 0.2); /* Light border for the glass effect */
        }

        .graph::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://www.transparenttextures.com/patterns/palapala.png'); /* Pala Pala Sprinkling effect */
            opacity: 0.15; /* Adjust opacity for the sprinkling effect */
            border-radius: 10px; /* Make sure the sprinkling matches the graph's rounded corners */
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <span class="back-arrow" onclick="window.history.back()">
                <i class="fas fa-arrow-left"></i>
            </span>
            <a href="/index2">
                <button class="menu-item"><i class="fas fa-tachometer-alt"></i> DASHBOARD</button>
            </a>
            <a href="/index3">
                <button class="menu-item"><i class="fas fa-box-open"></i> PRODUCT</button>
            </a>
            <a href="/index4">
                <button class="menu-item"><i class="fas fa-warehouse"></i> STOCK</button>
            </a>
            <a href="/index5">
                <button class="menu-item"><i class="fas fa-bell"></i> NOTIFICATION</button>
            </a>
            <a href="/index">
                <button class="menu-item"><i class="fas fa-calculator"></i> ESTIMATION</button>
            </a>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <header>
                <h1><i class="fas fa-bars menu-toggle" onclick="toggleSidebar()"></i> DASHBOARD</h1>
                <i class="fas fa-sign-out-alt logout" onclick="window.location.href='/logout'"></i>
            </header>

            <section class="analysis-section">
                
                <!-- Render Plotly Graph -->
                <div class="graph">
                    {{ graph_html1 | safe }}
                </div>




                
                <div class="graph">
                    <h2>Profit Analysis</h2>
                    
                    {{ graph_html2 | safe }}
                </div>
            </section>
        </div>
    </div>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById("sidebar");
            sidebar.classList.toggle("collapsed");
        }
    </script>
</body>
</html>
